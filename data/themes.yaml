# Coaching themes — source of truth for pipeline/state/themes.db.
#
# Edit this file to add, remove, or split themes. Then run:
#   python -m pipeline.scripts.seed_themes_db          # apply to local DB
#   python -m pipeline.scripts.render_curator_taxonomy --apply  # regen agent prompt
#
# Fields per theme:
#   name           kebab-case canonical name (primary key)
#   parent         umbrella theme name, or null for top-level
#   status         active | dead  (dead = split umbrella, never picked directly)
#   agent          agent name used by notion_research (sub-themes route via parent)
#   priority       ordering used in the curator priority rules; lower wins
#   definition     one-line description (rendered into agent prompt)
#   priority_rule  the rule text shown to the curator

themes:
- name: body-literacy
  parent: null
  status: active
  agent: body-literacy
  priority: 1
  definition: interoception, fatigue signals, physiological self-reading.
  priority_rule: Reference addresses a specific physiological or interoceptive mechanism.
- name: amcc-effect
  parent: null
  status: active
  agent: amcc-effect
  priority: 2
  definition: specifically the anterior mid-cingulate cortex literature (effortful-choice
    neural override). Prefer over `neuroscience-of-voluntary-effort` when the reference is
    directly about aMCC.
  priority_rule: Reference is directly about aMCC literature.
- name: strategic-vs-manufactured-suffering
  parent: null
  status: active
  agent: strategic-vs-manufactured-suffering
  priority: 4
  definition: meaning, cost accounting, ethics of chosen suffering (Frankl, voluntary-suffering
    decisions).
  priority_rule: Reference is about meaning, cost, or ethics of chosen suffering.
- name: naming-the-fear
  parent: null
  status: active
  agent: naming-the-fear
  priority: 5
  definition: articulating specific fears, fear-setting protocols.
  priority_rule: Reference is about articulating fear.
- name: preparedness-debt
  parent: null
  status: active
  agent: preparedness-debt
  priority: 6
  definition: cumulative cost of comfort choices over time.
  priority_rule: Reference is about cumulative comfort-debt.
- name: comfort-as-default
  parent: null
  status: dead
  agent: comfort-as-default
  priority: 999
  definition: DEAD umbrella (split 2026-05-11). Never pick directly — use a sub-theme.
  priority_rule: (dead umbrella — never picked directly)
