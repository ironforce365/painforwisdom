name: Set up ffmpeg
description: Puts a pinned static ffmpeg and ffprobe on PATH from the cache, so a slow apt mirror cannot hold up the job.

# To update: pick a month-end autobuild tag (BtbN keeps those), and take the name and sha256 from its checksums.sha256.
runs:
  using: composite
  steps:
    - id: cache
      uses: actions/cache@v4
      with:
        path: ~/.cache/ci-ffmpeg
        key: ffmpeg-static-41e9c565594c3906
    - if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      env:
        TAG: autobuild-2026-10-31-12-59
        NAME: ffmpeg-n8.1.3-27-g8dca1586f4-linux64-gpl-8.1.tar.xz
        SHA256: 41e9c565594c390622cf968d82fa4135d9e9a11d06c1515644288cbc844e3380
      run: |
        curl -fsSL --retry 3 -o "$RUNNER_TEMP/$NAME" "https://github.com/BtbN/FFmpeg-Builds/releases/download/$TAG/$NAME"
        echo "$SHA256  $RUNNER_TEMP/$NAME" | sha256sum -c -
        mkdir -p ~/.cache/ci-ffmpeg
        tar -xJf "$RUNNER_TEMP/$NAME" -C ~/.cache/ci-ffmpeg --strip-components=2 --wildcards '*/bin/ffmpeg' '*/bin/ffprobe'
    - shell: bash
      run: |
        echo "$HOME/.cache/ci-ffmpeg" >> "$GITHUB_PATH"
        "$HOME/.cache/ci-ffmpeg/ffmpeg" -hide_banner -version
