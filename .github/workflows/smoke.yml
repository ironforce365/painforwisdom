name: Pipeline smoke test

on:
  pull_request:
    branches: [main]
    paths:
      - 'pipeline/**'
      - 'tests/**'
      - 'agents/**'
      - 'pipeline/requirements.txt'
      - '.github/workflows/smoke.yml'
  workflow_dispatch:

concurrency:
  group: smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout (no submodule)
        uses: actions/checkout@v4
        with:
          # The vault submodule (gonandrap/painforwisdom-kb) is private and
          # the GitHub Actions token does not have access. We build a
          # minimal CI vault scaffold below — sandbox runs are ephemeral
          # so we don't need the real vault history.
          submodules: false
          fetch-depth: 1

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: pipeline/requirements.txt

      - name: Install pipeline deps
        run: |
          python -m pip install --upgrade pip
          pip install -r pipeline/requirements.txt

      - name: Build CI vault scaffold
        # Minimal vault structure so kb-curator's _vault_snapshot finds the
        # canonical theme/framework filenames and the LLM can "PROCEED"
        # against existing slugs instead of demanding approval for every
        # one. Bodies are stub placeholders — kb-curator overwrites them
        # when it touches a theme/framework anyway.
        run: |
          VAULT_DIR="${GITHUB_WORKSPACE}/ci-vault"
          BOOK_DIR="${VAULT_DIR}/gonzalo-book"
          mkdir -p "${BOOK_DIR}/themes" "${BOOK_DIR}/frameworks" "${BOOK_DIR}/entries"
          for slug in body-literacy comfort-as-default communication-under-pressure deliberate-discomfort guilt-recovery internal-signal-vs-external-metric naming-the-fear preparedness-debt training-adaptability pattern-manifestation; do
            printf "# %s\n\nStub theme body for CI smoke runs.\n" "${slug}" > "${BOOK_DIR}/themes/${slug}.md"
          done
          for slug in amcc-effect cookie-jar-types friction-types phase-1-protocol strategic-vs-manufactured-suffering the-genius-wound the-three-modes; do
            printf "# %s\n\nStub framework body for CI smoke runs.\n" "${slug}" > "${BOOK_DIR}/frameworks/${slug}.md"
          done
          printf "# Gonzalo's Journey — Master Timeline\n\n| Date | Entry | Themes | Quality | Core Insight |\n|------|-------|--------|---------|--------------|\n" > "${BOOK_DIR}/_index.md"
          printf "# Book Outline — In Formation\n\nStub outline for CI smoke runs.\n" > "${BOOK_DIR}/book-outline.md"
          # Make it a git repo so sandbox_reset.sh's `git checkout -- .`
          # path works without falling back to the no-worktree branch.
          git -C "${VAULT_DIR}" init -q -b ci-vault
          git -C "${VAULT_DIR}" config user.email ci@example.com
          git -C "${VAULT_DIR}" config user.name "CI Smoke"
          git -C "${VAULT_DIR}" add -A
          git -C "${VAULT_DIR}" commit -q -m "CI vault baseline"
          echo "VAULT_PATH_RESOLVED=${VAULT_DIR}" >> "$GITHUB_ENV"

      - name: Materialize .env.sandbox from secrets
        env:
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          NOTION_BLOG_DATA_SOURCE_ID: ${{ secrets.NOTION_BLOG_DATA_SOURCE_ID }}
          NOTION_RESEARCH_DATA_SOURCE_ID: ${{ secrets.NOTION_RESEARCH_DATA_SOURCE_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ANTHROPIC_AUTH_TOKEN: ${{ secrets.ANTHROPIC_AUTH_TOKEN }}
        run: |
          {
            echo "NOTION_API_KEY=${NOTION_API_KEY}"
            echo "NOTION_BLOG_DATA_SOURCE_ID=${NOTION_BLOG_DATA_SOURCE_ID}"
            echo "NOTION_RESEARCH_DATA_SOURCE_ID=${NOTION_RESEARCH_DATA_SOURCE_ID}"
            echo "TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}"
            echo "TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID}"
            echo "VAULT_PATH=${VAULT_PATH_RESOLVED}"
            echo "CHECKPOINT_DB_PATH=${GITHUB_WORKSPACE}/pipeline/checkpoints-ci.db"
            echo "ANTHROPIC_AUTH_TOKEN=${ANTHROPIC_AUTH_TOKEN}"
            echo "PIPELINE_PROFILE=sandbox"
          } > .env.sandbox
          for var in NOTION_API_KEY NOTION_BLOG_DATA_SOURCE_ID NOTION_RESEARCH_DATA_SOURCE_ID TELEGRAM_BOT_TOKEN TELEGRAM_CHAT_ID ANTHROPIC_AUTH_TOKEN; do
            value=$(grep -E "^${var}=" .env.sandbox | cut -d= -f2-)
            if [ -z "${value}" ]; then
              echo "::error::secret ${var} is missing or empty"
              exit 1
            fi
          done

      - name: Reset sandbox (Notion archive + vault revert)
        env:
          PYTHON_BIN: python
        run: bash tests/sandbox_reset.sh

      - name: Run smoke pipeline
        env:
          PYTHON_BIN: python
        run: bash tests/smoke_pipeline.sh

      - name: Upload run artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-run-${{ github.run_id }}
          path: |
            processed/
            pipeline/checkpoints-ci.db
          retention-days: 7
          if-no-files-found: ignore
