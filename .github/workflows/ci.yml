name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# No secrets are provided. Tests that need live keys skip themselves with an
# explicit reason (NOTION_API_KEY, OPENAI_API_KEY); `-rs` prints each one.
# The obsidian-vault submodule is private and is not checked out.

jobs:
  # Each test lands in exactly one job: integration by marker (tests/ `pytestmark`),
  # console by filename, core is the rest, so a new file is never orphaned.
  # Keep the console globs in both `args`. Globs stay quoted in --ignore-glob: nullglob would drop them.
  pipeline:
    name: ${{ matrix.job }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - job: pipeline unit (core)
            args: >-
              tests -m "not integration"
              --ignore=tests/test_decision_tree.py
              --ignore-glob='tests/test_ui_*'
              --ignore-glob='tests/test_console_*'
              --ignore-glob='tests/test_node_result*'
          - job: pipeline unit (console)
            args: >-
              tests/test_ui_* tests/test_console_* tests/test_node_result*
              -m "not integration"
          - job: pipeline integration
            args: tests -m integration --ignore=tests/test_decision_tree.py
            ffmpeg: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt
      - name: Install system deps
        if: matrix.ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      # Full requirements: pipeline.graph, reached from every job, imports every node module.
      - run: pip install -r pipeline/requirements.txt pytest
      - run: |
          shopt -s nullglob
          python -m pytest ${{ matrix.args }} -q -rs

  # tests/test_decision_tree.py is required: if it is absent, pytest exits 4 and this job fails.
  decision-tree:
    name: decision tree
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt
      - run: pip install -r pipeline/requirements.txt pytest
      - run: python -m pytest tests/test_decision_tree.py -q

  console-browser:
    name: console browser (${{ matrix.shard }}/${{ strategy.job-total }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    defaults:
      run:
        working-directory: pipeline/ui/e2e
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt
      # Full requirements: the console server builds the graph at startup.
      - run: pip install -r ../../requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: pipeline/ui/e2e/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:shard -- --shard=${{ matrix.shard }}/${{ strategy.job-total }}
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-shard-${{ matrix.shard }}
          path: pipeline/ui/e2e/coverage-shards/
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-${{ matrix.shard }}
          path: |
            pipeline/ui/e2e/playwright-report/
            pipeline/ui/e2e/test-results/
          retention-days: 7

  console-coverage-gate:
    name: console coverage gate
    needs: console-browser
    # Runs when a shard failed too: a skipped job would read as passing.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: pipeline/ui/e2e
    steps:
      - uses: actions/checkout@v4
      - name: Require every browser shard
        if: needs.console-browser.result != 'success'
        run: |
          echo "::error::console browser shards: ${{ needs.console-browser.result }}; no complete coverage to gate"
          exit 1
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: pipeline/ui/e2e/package-lock.json
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          pattern: coverage-shard-*
          path: pipeline/ui/e2e/coverage-shards
          merge-multiple: true
      - run: npm run coverage:merge
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: coverage-merged
          path: pipeline/ui/e2e/coverage/
          retention-days: 7

  coach:
    name: coach tests (${{ matrix.group }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: grounding
            args: tests/test_grounding_*.py
          - group: agent
            args: tests/test_agent_*.py
          - group: telegram-vault_rag
            args: tests/test_telegram_*.py tests/test_vault_rag_*.py
          # Everything not claimed above, so a new test file is never orphaned.
          - group: rest
            args: >-
              tests
              --ignore-glob=tests/test_grounding_*.py
              --ignore-glob=tests/test_agent_*.py
              --ignore-glob=tests/test_telegram_*.py
              --ignore-glob=tests/test_vault_rag_*.py
    defaults:
      run:
        working-directory: services/coach
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: services/coach/requirements.txt
      - name: Install system deps
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg libsndfile1
      # CPU torch: the CUDA wheels are ~5GB and tests never touch a GPU.
      - run: pip install --extra-index-url https://download.pytorch.org/whl/cpu -r requirements.txt
      - run: pip install -e . --no-deps
      - run: python -m pytest ${{ matrix.args }} -q -rs
