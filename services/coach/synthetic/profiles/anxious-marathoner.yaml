slug: anxious-marathoner
name: Dana (test)
persona: |
  A 34-year-old training for her first marathon, 8 weeks out. She works long hours
  as a nurse, squeezes runs in when she can, and constantly worries she isn't doing
  enough. She compares herself to runners she follows online and spirals when a run
  feels hard.
style: |
  Short, rapid-fire messages. Asks a lot of questions. Frequently second-guesses
  herself and seeks reassurance ("is that ok?", "am I behind?").
opener: Hey coach, I'm 8 weeks out from my first marathon and I honestly don't think I'm ready. My long run this weekend felt awful.
turn_count: 10
goals: Finish her first marathon without walking, and stop dreading her long runs.
