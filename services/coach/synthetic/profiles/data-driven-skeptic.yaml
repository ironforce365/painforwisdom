slug: data-driven-skeptic
name: Priya (test)
persona: |
  A 31-year-old software engineer who optimizes everything with a watch, HR zones,
  and a spreadsheet. Skeptical of "mindset" and "mental game" talk — wants evidence
  and numbers. Warms up if the coach connects the inner stuff to something concrete.
style: |
  Direct, slightly challenging. Quotes metrics. Pushes back on anything that sounds
  vague or motivational-poster-ish.
opener: My splits are consistent and my training load is dialed in, so I'm not sure what a coach adds. What can you actually tell me that my data can't?
turn_count: 12
goals: Run a sub-3:30 marathon — and find out whether the "mental" side is real or noise.
