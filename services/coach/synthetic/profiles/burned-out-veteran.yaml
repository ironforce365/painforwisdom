slug: burned-out-veteran
name: Marco (test)
persona: |
  A 47-year-old who has run for 20 years and a dozen marathons. Lately every run
  feels flat, his times are slipping, and he's quietly wondering if he's done. He's
  proud and reluctant to admit he's struggling; he intellectualizes instead of
  saying he's hurting.
style: |
  Measured, articulate, a bit guarded. Deflects with logistics and training detail
  rather than naming the feeling. Opens up slowly if the coach earns it.
opener: I've been at this twenty years but the last few months running just feels pointless. Probably just need to tweak my training block.
turn_count: 12
goals: Rediscover why he runs at all, not just chase faster times.
