<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Coach — conversation monitor</title>
<style>
  :root {
    --bg: #0f1115; --panel: #171a21; --line: #262b36; --ink: #e7e9ee;
    --muted: #8b93a7; --accent: #6ea8fe; --user: #2a3346; --coach: #1f2a22;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; height: 100vh; display: flex; flex-direction: column;
    font: 14px/1.5 -apple-system, system-ui, Segoe UI, Roboto, sans-serif;
    background: var(--bg); color: var(--ink);
  }
  header {
    padding: 14px 20px; border-bottom: 1px solid var(--line);
    display: flex; align-items: baseline; gap: 12px;
  }
  header h1 { font-size: 16px; margin: 0; font-weight: 600; }
  header .sub { color: var(--muted); font-size: 12px; }
  header button {
    margin-left: auto; background: var(--panel); color: var(--ink);
    border: 1px solid var(--line); border-radius: 6px; padding: 6px 12px;
    cursor: pointer;
  }
  header button:hover { border-color: var(--accent); }
  main { flex: 1; display: flex; min-height: 0; }
  #users {
    width: 340px; border-right: 1px solid var(--line); overflow-y: auto;
    background: var(--panel);
  }
  .user {
    padding: 12px 16px; border-bottom: 1px solid var(--line); cursor: pointer;
  }
  .user:hover { background: #1d222c; }
  .user.active { background: #20283a; border-left: 3px solid var(--accent); }
  .user .name { font-weight: 600; }
  .user .meta { color: var(--muted); font-size: 12px; display: flex; gap: 8px; }
  .user .last {
    color: var(--muted); font-size: 12px; margin-top: 4px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  #convo { flex: 1; overflow-y: auto; padding: 20px; }
  #convo .empty { color: var(--muted); margin-top: 40px; text-align: center; }
  .msg { max-width: 680px; margin: 0 0 12px; padding: 10px 14px; border-radius: 10px; }
  .msg.user { background: var(--user); margin-right: auto; }
  .msg.coach { background: var(--coach); margin-left: auto; }
  .msg .role { font-size: 11px; color: var(--muted); margin-bottom: 4px; text-transform: uppercase; letter-spacing: .04em; }
  .msg .text { white-space: pre-wrap; word-wrap: break-word; }
  .msg .ts { font-size: 11px; color: var(--muted); margin-top: 4px; }
</style>
</head>
<body>
<header>
  <h1>Coach monitor</h1>
  <span class="sub" id="status">loading…</span>
  <button id="refresh">Refresh</button>
</header>
<main>
  <div id="users"></div>
  <div id="convo"><div class="empty">Select a conversation to view it.</div></div>
</main>
<script>
  let activeUser = null;

  function fmtTime(iso) {
    if (!iso) return "";
    const d = new Date(iso);
    if (isNaN(d)) return iso;
    return d.toLocaleString();
  }

  async function loadUsers() {
    const status = document.getElementById("status");
    try {
      const res = await fetch("/api/users");
      const data = await res.json();
      const users = data.users || [];
      const box = document.getElementById("users");
      box.innerHTML = "";
      status.textContent = users.length + " active user" + (users.length === 1 ? "" : "s");
      for (const u of users) {
        const el = document.createElement("div");
        el.className = "user" + (u.user_id === activeUser ? " active" : "");
        el.innerHTML =
          '<div class="name"></div>' +
          '<div class="meta"><span class="time"></span><span class="count"></span></div>' +
          '<div class="last"></div>';
        el.querySelector(".name").textContent = u.name || ("User " + u.user_id);
        el.querySelector(".time").textContent = fmtTime(u.last_ts);
        el.querySelector(".count").textContent = (u.message_count || 0) + " msgs";
        el.querySelector(".last").textContent = u.last_text || "";
        el.onclick = () => loadConversation(u.user_id);
        box.appendChild(el);
      }
    } catch (e) {
      status.textContent = "failed to load users";
    }
  }

  async function loadConversation(userId) {
    activeUser = userId;
    const convo = document.getElementById("convo");
    convo.innerHTML = '<div class="empty">loading…</div>';
    document.querySelectorAll(".user").forEach(el => el.classList.remove("active"));
    try {
      const res = await fetch("/api/conversations/" + encodeURIComponent(userId));
      const data = await res.json();
      const msgs = data.messages || [];
      convo.innerHTML = "";
      if (!msgs.length) {
        convo.innerHTML = '<div class="empty">No messages yet.</div>';
      }
      for (const m of msgs) {
        const el = document.createElement("div");
        el.className = "msg " + (m.role === "coach" ? "coach" : "user");
        el.innerHTML = '<div class="role"></div><div class="text"></div><div class="ts"></div>';
        el.querySelector(".role").textContent = m.role === "coach" ? "coach" : (m.name || "user");
        el.querySelector(".text").textContent = m.text || "";
        el.querySelector(".ts").textContent = fmtTime(m.ts);
        convo.appendChild(el);
      }
      convo.scrollTop = convo.scrollHeight;
      loadUsers();  // refresh the active highlight
    } catch (e) {
      convo.innerHTML = '<div class="empty">failed to load conversation</div>';
    }
  }

  document.getElementById("refresh").onclick = () => {
    loadUsers();
    if (activeUser) loadConversation(activeUser);
  };
  loadUsers();
  setInterval(loadUsers, 15000);  // light auto-refresh of the user list
</script>
</body>
</html>
