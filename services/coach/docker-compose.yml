services:
  mem0-postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${MEM0_PG_USER}
      POSTGRES_PASSWORD: ${MEM0_PG_PASSWORD}
      POSTGRES_DB: ${MEM0_PG_DB}
    volumes:
      - mem0_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${MEM0_PG_USER}"]
      interval: 10s
      retries: 5
    restart: unless-stopped

  mem0-neo4j:
    image: neo4j:5.20-community
    environment:
      NEO4J_AUTH: ${MEM0_NEO4J_USER}/${MEM0_NEO4J_PASSWORD}
      NEO4J_PLUGINS: '["apoc"]'
    volumes:
      - mem0_neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:7474 || exit 1"]
      interval: 15s
      retries: 5
    restart: unless-stopped

  mem0-api:
    image: mem0ai/mem0:latest
    depends_on:
      mem0-postgres:
        condition: service_healthy
      mem0-neo4j:
        condition: service_healthy
      litellm:
        condition: service_healthy
    environment:
      ANTHROPIC_BASE_URL: http://litellm:4000
      ANTHROPIC_API_KEY: ${LITELLM_MASTER_KEY}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      POSTGRES_HOST: mem0-postgres
      POSTGRES_USER: ${MEM0_PG_USER}
      POSTGRES_PASSWORD: ${MEM0_PG_PASSWORD}
      POSTGRES_DB: ${MEM0_PG_DB}
      NEO4J_URI: bolt://mem0-neo4j:7687
      NEO4J_USER: ${MEM0_NEO4J_USER}
      NEO4J_PASSWORD: ${MEM0_NEO4J_PASSWORD}
    ports:
      - "8765:8000"
    restart: unless-stopped

  litellm:
    image: ghcr.io/berriai/litellm:main-latest
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY}
      # OAuth token forwarded upstream as Authorization: Bearer.
      CLAUDE_CODE_OAUTH_TOKEN: ${CLAUDE_CODE_OAUTH_TOKEN}
      # LiteLLM's Anthropic adapter reads ANTHROPIC_API_KEY when present; pass the
      # OAuth token here so the adapter treats it as the bearer credential.
      ANTHROPIC_API_KEY: ${CLAUDE_CODE_OAUTH_TOKEN}
    volumes:
      - ./litellm_config.yaml:/app/config.yaml:ro
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    ports:
      - "4000:4000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:4000/health/liveliness"]
      interval: 15s
      retries: 5
    restart: unless-stopped

volumes:
  mem0_pg_data:
  mem0_neo4j_data:
