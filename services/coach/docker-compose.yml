# DNS pinning (2026-07-01→04 outage): docker copies the HOST's resolver into a
# container's embedded DNS at container-START time only. The stack once started
# while Tailscale MagicDNS (100.100.100.100) was the host resolver; the host
# later moved to 1.1.1.1 and every already-running container silently lost
# external DNS for 3 days (agent couldn't reach api.anthropic.com → every turn
# died slow). Pinning public resolvers removes the dependency on host-resolver
# state entirely. Compose-internal names (mem0-api, coach-agent…) resolve via
# docker's embedded DNS regardless, so the pin only affects external lookups.
x-coach-dns: &coach-dns
  dns:
    - 1.1.1.1
    - 8.8.8.8

services:
  mem0-postgres:
    <<: *coach-dns
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${MEM0_PG_USER}
      POSTGRES_PASSWORD: ${MEM0_PG_PASSWORD}
      POSTGRES_DB: ${MEM0_PG_DB}
    volumes:
      - mem0_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${MEM0_PG_USER}"]
      interval: 10s
      retries: 5
    restart: unless-stopped

  # Vector-only Mem0 via a minimal in-house FastAPI shim over the mem0ai lib
  # (see mem0-server/app.py). The official mem0/mem0-api-server image is
  # published arm64-only — unrunnable on this amd64 host — and carries JWT/app-DB
  # baggage the coach doesn't need. Graph memory is a documented follow-up.
  mem0-api:
    <<: *coach-dns
    build: ./mem0-server
    depends_on:
      mem0-postgres:
        condition: service_healthy
    environment:
      # mem0's default LLM + embedder are OpenAI — no ANTHROPIC_API_KEY needed.
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      POSTGRES_HOST: mem0-postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ${MEM0_PG_USER}
      POSTGRES_PASSWORD: ${MEM0_PG_PASSWORD}
      POSTGRES_DB: ${MEM0_PG_DB}
      POSTGRES_COLLECTION_NAME: coach_memories
    healthcheck:
      # Liveness only (is uvicorn answering?); the watchdog does deep checks.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped

  coach-agent:
    <<: *coach-dns
    build: .
    depends_on:
      mem0-api:
        condition: service_started
    environment:
      CLAUDE_CODE_OAUTH_TOKEN: ${CLAUDE_CODE_OAUTH_TOKEN}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      MEM0_API_URL: http://mem0-api:8000
      COACH_INDEX_STORAGE_DIR: /data/vault_rag
      COACH_USER_MEMORY_DIR: /data/user_memory
      COACH_INBOX_ROOT: /vault/_inbox
      COACH_VAULT_PATH: /vault
      COACH_USAGE_LOG: /data/usage.jsonl
      # The reranker/embedder model bytes live on the whisper_cache volume; with
      # offline mode ON a cold build never phones huggingface.co (2026-07-04: a
      # DNS outage broke doctrine retrieval despite a fully-populated cache).
      # Fresh host/empty volume? Set HF_HUB_OFFLINE=0 in .env.coach for ONE run
      # to populate the cache, then unset.
      HF_HUB_OFFLINE: ${HF_HUB_OFFLINE:-1}
      # Debug canary: append a "kb sources" footer to each reply naming the vault
      # slugs that grounded the turn ("(none)" = generic-answer alarm). Default-on
      # for now; flip via COACH_DEBUG in .env.coach.
      COACH_DEBUG: ${COACH_DEBUG:-true}
      # Grounding gate (Stream 0): per-claim grounding check on the send-path.
      # Default OFF — inert until Stream 2 emits [[claim ...]] tags; flip via
      # COACH_GROUNDING_GATE in .env.coach.
      COACH_GROUNDING_GATE: ${COACH_GROUNDING_GATE:-false}
      # Stream 3 (doctrine vs memory): the coach grounds teaching on the distilled
      # doctrine INDEX (built from the corpus mounted at /corpus). All corpora live
      # under COACH_CORPUS_ROOT (host ${COACH_CORPUS_HOST_PATH} -> /corpus :ro).
      COACH_CORPUS_ROOT: /corpus
      COACH_DOCTRINE_INDEX_DIR: ${COACH_DOCTRINE_INDEX_DIR:-/data/doctrine_index}
      # Coaching-topic + no-file guardrail (Stream F4): a second classifier that
      # runs in PARALLEL with the grounding gate, replacing off-topic / file-offer
      # replies with a localized coaching redirect. Default OFF; flip via
      # COACH_TOPIC_GUARD in .env.coach.
      COACH_TOPIC_GUARD: ${COACH_TOPIC_GUARD:-false}
      # Turn-latency budgets (2026-07-04 outage: an unreachable API burned 191s of
      # SDK retries + 120s of doomed gate/guard calls per turn while the bot's
      # read deadline made every reply "Still with you"). Generation is capped at
      # COACH_STREAM_BUDGET_S; each gate/guard `claude -p` call at COACH_LLM_TIMEOUT_S.
      COACH_STREAM_BUDGET_S: ${COACH_STREAM_BUDGET_S:-150}
      COACH_LLM_TIMEOUT_S: ${COACH_LLM_TIMEOUT_S:-60}
      # Model + effort pinning (2026-07-04 turn-latency review, R1). Prod used to
      # ride the CLI's silent default (sonnet-4-6, effort=high); the A/B showed
      # sonnet-5 @ effort=medium beats it on every rubric dimension at ~half the
      # generation latency. Env-tunable so an Opus A/B week is a config change, not
      # a deploy. effort ∈ low|medium|high|xhigh|max (empty → CLI default).
      COACH_AGENT_MODEL: ${COACH_AGENT_MODEL:-claude-sonnet-5}
      COACH_AGENT_EFFORT: ${COACH_AGENT_EFFORT:-medium}
      # Streaming 'story' UX (R7): stream the model's reasoning live as rationale
      # before the answer. Kill-switch to answer-only streaming if it misbehaves.
      COACH_STREAM_RATIONALE: ${COACH_STREAM_RATIONALE:-true}
      # Gate/guard/judge subprocess effort (R6): OFF by default (CLI default) so it
      # never silently shifts grounding-judge calibration. Set to `low` to shave
      # ~2-4s off these bounded classification calls once a calibration re-check
      # confirms it holds. ∈ low|medium|high|xhigh|max.
      COACH_LLM_EFFORT: ${COACH_LLM_EFFORT:-}
    # CRITICAL: do NOT set ANTHROPIC_API_KEY here — it would shadow the OAuth token.
    volumes:
      - ${VAULT_HOST_PATH}:/vault
      - ${COACH_CORPUS_HOST_PATH}:/corpus:ro
      - coach_data:/data
      - whisper_cache:/root/.cache
    command: ["uvicorn", "agent.service:app", "--host", "0.0.0.0", "--port", "8800"]
    ports:
      - "8800:8800"
    healthcheck:
      # Liveness only (is uvicorn answering?); the watchdog polls /health/deep.
      test: ["CMD", "curl", "-fsS", "http://localhost:8800/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped

  telegram-bot:
    <<: *coach-dns
    build: .
    depends_on:
      coach-agent:
        condition: service_started
    environment:
      TELEGRAM_COACH_BOT_TOKEN: ${TELEGRAM_COACH_BOT_TOKEN}
      # Admin chat for the new-user approval flow (Approve/Deny inline buttons).
      TELEGRAM_COACH_ALERT_CHAT_ID: ${TELEGRAM_COACH_ALERT_CHAT_ID}
      COACH_AGENT_URL: http://coach-agent:8800
      COACH_ACCESS_JSON: /app/access.json
      # Pilot onboarding state on the shared coach_state volume (the monitor
      # service reads the same volume). welcome-once tracking, the per-user daily
      # message quota, and the conversation log all live here.
      COACH_WELCOME_JSON: /state/welcomed.json
      COACH_QUOTA_JSON: /state/quota.json
      # Daily message cap per user (resets at local midnight in COACH_QUOTA_TZ).
      COACH_QUOTA_LIMIT: ${COACH_QUOTA_LIMIT:-100}
      COACH_QUOTA_TZ: ${COACH_QUOTA_TZ:-UTC}
      COACH_CONVO_LOG_DIR: /state/conversations
      # Proactive outreach: a scheduler re-engages quiet users (1-day inactivity /
      # 2-hour open-loop windows, randomized send time within them, quiet hours in
      # COACH_QUOTA_TZ). Default OFF — flip COACH_PROACTIVE_OUTREACH in .env.coach.
      # Quiet-hours window + lack of per-user timezone are documented assumptions (docs/).
      COACH_PROACTIVE_OUTREACH: ${COACH_PROACTIVE_OUTREACH:-false}
      COACH_OUTREACH_JSON: /state/outreach.json
      COACH_OUTREACH_TICK_MIN: ${COACH_OUTREACH_TICK_MIN:-30}
    volumes:
      - whisper_cache:/root/.cache
      # Persist the runtime allowlist on the host. The approval flow mutates
      # access.json at runtime; baked into the image it would reset to the
      # committed (empty) list on every rebuild, silently revoking approved
      # users. The host file is the source of truth and survives rebuilds.
      - ${COACH_ACCESS_HOST_PATH}:/app/access.json
      # Shared pilot state (welcome/quota/conversation log) — written here,
      # read by the monitor service.
      - coach_state:/state
    command: ["python", "-m", "telegram_bot.bot"]
    restart: unless-stopped

  # Read-only monitoring web UI (F2 + F3): a user list + per-conversation viewer
  # over the conversation log the bot writes to coach_state. Mounted read-only —
  # it never mutates state or calls the coach. Bind the port to localhost only;
  # there is no auth, so it must not be exposed to the network.
  monitor:
    <<: *coach-dns
    build: .
    environment:
      COACH_CONVO_LOG_DIR: /state/conversations
    volumes:
      - coach_state:/state:ro
    command: ["uvicorn", "monitor.app:app", "--host", "0.0.0.0", "--port", "8810"]
    ports:
      - "127.0.0.1:8810:8810"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8810/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  coach-eval:
    <<: *coach-dns
    build: .
    profiles: ["eval"]
    depends_on:
      coach-agent:
        condition: service_started
    environment:
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      COACH_AGENT_URL: http://coach-agent:8800
      COACH_EVAL_OUT: /eval-runs/nightly.jsonl
    volumes:
      - coach_data:/eval-runs
    # No restart policy — this is a one-shot via `docker compose run --rm coach-eval ...`

  # Synthetic-user test harness: drives persona profiles through full conversations
  # with the live coach on the TEST channel (no inbox / KB pollution). Conversations
  # show in the monitor UI badged as tests. Persona replies use the Claude CLI
  # (subscription token), so it needs CLAUDE_CODE_OAUTH_TOKEN. One-shot:
  #   docker compose run --rm synthetic                       # default profiles
  #   docker compose run --rm synthetic python -m synthetic.runner --turns 120 --concurrency 5
  synthetic:
    <<: *coach-dns
    build: .
    profiles: ["synthetic"]
    depends_on:
      coach-agent:
        condition: service_started
    environment:
      CLAUDE_CODE_OAUTH_TOKEN: ${CLAUDE_CODE_OAUTH_TOKEN}
      COACH_AGENT_URL: http://coach-agent:8800
      COACH_CONVO_LOG_DIR: /state/conversations
      SYNTHETIC_CONCURRENCY: ${SYNTHETIC_CONCURRENCY:-3}
      SYNTHETIC_MODEL: ${SYNTHETIC_MODEL:-sonnet}
    volumes:
      # Writes the conversation log the monitor reads (rw, same volume as the bot).
      - coach_state:/state
    command: ["python", "-m", "synthetic.runner"]
    # No restart policy — one-shot via `docker compose run --rm synthetic`.

volumes:
  mem0_pg_data:
  coach_data:
  coach_state:
  whisper_cache:
