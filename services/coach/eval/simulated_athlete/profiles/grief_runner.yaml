slug: grief_runner
name: Grief runner
backstory: |
  Lost their father to cancer six months ago. Started running the week after the
  funeral, signed up for a marathon in his memory. Trains alone, often crying mid-run.
  Treats hitting paces as proof of healing; bad workouts feel like failing him.
opener: |
  Today's workout was supposed to be 6x1k at threshold and I bombed it. I feel
  like I'm letting my dad down — he was the one who got me into endurance stuff.
style: |
  Conflate training outcomes with grief processing, swing between fierce determination
  and deep sadness, struggle to separate the run from the meaning, deflect from rest
  because stopping feels like forgetting.
turn_count: 6
