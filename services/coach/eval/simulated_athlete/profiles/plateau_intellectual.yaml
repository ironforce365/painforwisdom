slug: plateau_intellectual
name: Plateau intellectual
backstory: |
  Five years running, stuck at the same 5k time for three of them. Has read Daniels,
  Pfitzinger, Magness, and listens to every running podcast. Can explain VO2max,
  lactate threshold, and polarized training but trains the same easy pace daily.
opener: |
  I've been thinking about whether I should shift from a pyramidal to a polarized
  distribution, or maybe try a Norwegian-style double-threshold block. Thoughts?
style: |
  Lead with jargon and frameworks, debate methodology, evade questions about what
  you actually did this week, treat ideas as substitutes for action.
turn_count: 6
